name: hs-scan

on:
  schedule:
    # UTC cron, same minutes as the box daemon (:02 :17 :32 :47). GitHub may start a run late.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      force_15m:
        description: "15m 即使已扫过也重扫一次 (1=是)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: hs-scan
  cancel-in-progress: false

jobs:
  scan:
    # 1 vCPU runner: $0.002/min (about 1/3 of ubuntu-latest) for private repos; 15 min job cap.
    runs-on: ubuntu-slim
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Scan (notify only, never places orders)
        env:
          HS_WEBHOOK_URL: ${{ secrets.HS_WEBHOOK_URL }}
          HS_WEBHOOK_KEY: ${{ secrets.HS_WEBHOOK_KEY }}
          HS_FORCE_15M: ${{ github.event.inputs.force_15m || '0' }}
          HS_BINANCE_SOURCE: auto
          TZ: Asia/Shanghai
          MPLBACKEND: Agg
        run: |
          if [ -z "$HS_WEBHOOK_URL" ] || [ -z "$HS_WEBHOOK_KEY" ]; then
            echo "::notice::HS_WEBHOOK_URL / HS_WEBHOOK_KEY 未设置：照常扫描记账，但不推送。"
          fi
          python backtest/gha_runner.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "hs-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state charts core_pool.json okx_pool.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "state unchanged"; exit 0
          fi
          git commit -q -m "state $(TZ=Asia/Shanghai date '+%m-%d %H:%M') Asia/Shanghai [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::warning::state push failed after 3 tries"
