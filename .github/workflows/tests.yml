name: tests
on:
  push:
    paths: ["backtest/**", "research/**", "requirements*.txt", ".github/workflows/tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-slim
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt
      - run: cd backtest && python -m pytest -q tests -p no:cacheprovider
